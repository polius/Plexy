<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plexy — Torrent Downloader for Plex</title>
    <meta name="theme-color" content="#0c0c0e">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'><circle cx='256' cy='256' r='256' fill='%23e5a00d'/><path fill='%231a1402' d='M200 352V160l128 96-128 96z'/></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toasts" id="toasts"></div>

    <div class="app">
        <!-- Masthead -->
        <header class="masthead">
            <a class="brand" href="/" aria-label="Plexy home">
                <svg class="brand-mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="256" cy="256" r="256" fill="#e5a00d"/>
                    <path fill="#1a1402" d="M200 352V160l128 96-128 96z"/>
                </svg>
                <span class="brand-name">Plexy</span>
                <span class="brand-version">v1.4.1</span>
            </a>
            <div class="masthead-spacer"></div>
            <div class="plex-chip is-checking" id="plexChip" title="Plex connection status">
                <span class="dot"></span>
                <span class="label" id="plexChipLabel">Checking Plex…</span>
            </div>
        </header>

        <!-- ============ Add a download ============ -->
        <section class="card add-card">
            <div class="add-header">
                <div class="section-head">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <div>
                        <div class="section-title" id="addTitle">Add a download</div>
                        <div class="section-sub" id="addSub">Choose a torrent source to get started</div>
                    </div>
                </div>
                <div class="crumbs" id="addCrumbs" hidden></div>
            </div>

            <!-- view: source -->
            <div class="add-view" id="view-source">
                <div class="tabs" role="tablist" aria-label="Torrent source">
                    <button class="tab active" role="tab" data-tab="file" aria-selected="true">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                        <span class="label">Torrent File</span>
                    </button>
                    <button class="tab" role="tab" data-tab="magnet" aria-selected="false">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15a6 6 0 1 1 12 0v6h-4v-6a2 2 0 1 0-4 0v6H6z"/><line x1="6" y1="9" x2="10" y2="9"/><line x1="14" y1="9" x2="18" y2="9"/></svg>
                        <span class="label">Magnet Link</span>
                    </button>
                    <button class="tab" role="tab" data-tab="nyaa" aria-selected="false">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <span class="label">Nyaa Search</span>
                    </button>
                </div>

                <div class="tab-panel" id="panel-file" role="tabpanel">
                    <input type="file" id="fileInput" accept=".torrent" hidden>
                    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload torrent file">
                        <div class="dropzone-icon">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        </div>
                        <div>
                            <div class="dropzone-title">Upload torrent file</div>
                            <div class="dropzone-hint">Click to browse or drag &amp; drop a .torrent file</div>
                        </div>
                    </div>
                    <div class="file-pill" id="filePill"></div>
                    <button class="btn btn-primary btn-block" id="fileContinue" hidden style="margin-top:14px">
                        Continue
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </div>

                <div class="tab-panel" id="panel-magnet" role="tabpanel" hidden>
                    <div class="field">
                        <label class="label" for="magnetInput">Magnet link</label>
                        <input type="text" class="input input-mono" id="magnetInput" placeholder="magnet:?xt=urn:btih:…" autocomplete="off">
                        <span class="hint-line"><span class="kbd">Enter</span> to continue</span>
                    </div>
                    <button class="btn btn-primary btn-block" id="magnetContinue" style="margin-top:16px">
                        Continue
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </div>

                <div class="tab-panel" id="panel-nyaa" role="tabpanel" hidden>
                    <div class="search-bar">
                        <input type="text" class="input" id="nyaaInput" placeholder="Search anime torrents on nyaa.si…" autocomplete="off">
                        <button class="btn btn-primary" id="nyaaSearchBtn">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            Search
                        </button>
                    </div>
                    <span class="hint-line"><span class="kbd">Enter</span> to search · sorted by seeders</span>
                    <div id="nyaaResults" aria-live="polite"></div>
                </div>
            </div>

            <!-- view: file selection -->
            <div class="add-view" id="view-files" hidden>
                <div class="fs-summary" id="fsSummary"></div>
                <div class="fs-toolbar">
                    <span class="fs-stat"><b id="fsSelCount">0</b> of <b id="fsTotalCount">0</b> files · <b id="fsSelSize">0 B</b></span>
                    <button class="btn btn-secondary btn-sm" id="fsToggleAll">Deselect all</button>
                </div>
                <div class="fs-list" id="fsList"><div class="fs-viewport" id="fsViewport"></div></div>
                <label class="checkrow" for="flattenCheck" style="margin-top:14px">
                    <input type="checkbox" class="check" id="flattenCheck">
                    <span>
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                        Flatten directory structure
                        <span class="hint">— save all files into one folder</span>
                    </span>
                </label>
                <div class="btn-row">
                    <button class="btn btn-secondary" id="filesBack">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        Back
                    </button>
                    <button class="btn btn-primary grow" id="filesContinue">
                        Continue
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </div>
            </div>

            <!-- view: destination -->
            <div class="add-view" id="view-dest" hidden>
                <div class="browser">
                    <div class="browser-bar">
                        <div class="crumb">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                            <span class="path" id="crumbPath">/</span>
                        </div>
                        <span class="browser-count" id="browserCount"></span>
                        <button class="btn btn-secondary btn-sm" id="newFolderBtn" title="Create folder here">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
                            New
                        </button>
                    </div>
                    <div class="browser-filter">
                        <input type="text" class="input" id="folderFilter" placeholder="Filter folders…" autocomplete="off">
                    </div>
                    <div class="browser-list" id="folderList"></div>
                </div>
                <div class="btn-row">
                    <button class="btn btn-secondary" id="destBack">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        Back
                    </button>
                    <button class="btn btn-primary grow" id="addBtn">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add download to <span id="addBtnPath" class="mono" style="font-family:var(--mono)">/</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- ============ Downloads ============ -->
        <section class="card">
            <div class="section-head between">
                <div class="left">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <div class="section-title">Downloads</div>
                </div>
                <span class="count-pill" id="dlCount" hidden>0</span>
            </div>
            <div id="dlList"></div>
        </section>

        <!-- ============ Plex ============ -->
        <section class="card">
            <div class="section-head">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
                <div>
                    <div class="section-title">Plex library</div>
                    <div class="section-sub">Scan a library to pick up newly downloaded files</div>
                </div>
            </div>
            <div id="plexBody">
                <div class="plex-controls">
                    <select class="select" id="plexLibrary"><option value="">Loading libraries…</option></select>
                    <button class="btn btn-success" id="refreshBtn" disabled>
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                        Refresh
                    </button>
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
